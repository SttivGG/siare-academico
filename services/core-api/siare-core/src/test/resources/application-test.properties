# Isolated web/security tests; these do NOT prove database connectivity.
spring.autoconfigure.exclude=org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration
spring.datasource.url=jdbc:h2:mem:siare;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.connection-init-sql=
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.mongodb.database=unused
spring.mongodb.username=unused
spring.mongodb.password=unused
management.health.db.enabled=false
management.health.mongo.enabled=false
