spring.application.name=siare-core
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Mandatory environment configuration: no production credential fallback.
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?connectTimeout=5000&socketTimeout=5000&allowPublicKeyRetrieval=true&sslMode=DISABLED
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true

siare.jwt.issuer=${JWT_ISSUER:siare-core}
siare.jwt.ttl=${JWT_TTL:PT5M}
siare.jwt.public-key=${JWT_PUBLIC_KEY:file:/run/siare-keys/public.pem}
siare.jwt.private-key=${JWT_PRIVATE_KEY:file:/run/siare-keys/private.pem}
server.error.include-message=never
server.error.include-stacktrace=never

# Spring Boot 4 uses spring.mongodb.*, not spring.data.mongodb.uri.
spring.mongodb.host=${MONGO_HOST:mongo}
spring.mongodb.port=${MONGO_PORT:27017}
spring.mongodb.database=${MONGO_DATABASE}
spring.mongodb.username=${MONGO_USER}
spring.mongodb.password=${MONGO_PASSWORD}
spring.mongodb.authentication-database=${MONGO_DATABASE}
spring.data.mongodb.auto-index-creation=false

management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=false
spring.jmx.enabled=false

# Multipart spills to OS temporary files; metadata never contains the original binary.
siare.documents.max-bytes=${DOCUMENT_MAX_BYTES:15728640}
spring.servlet.multipart.max-file-size=${DOCUMENT_MAX_BYTES:15728640}B
spring.servlet.multipart.max-request-size=${DOCUMENT_REQUEST_MAX_BYTES:15859712}B
spring.servlet.multipart.file-size-threshold=0B
siare.documents.processor-url=${CONTENT_AI_URL:http://content-ai:5000}
siare.documents.service-token=${CONTENT_SERVICE_TOKEN}

# Adaptive learning credentials are intentionally separate and not used by the browser.
siare.learning.service-token=${LEARNING_SERVICE_TOKEN}
siare.learning.max-bytes=${LEARNING_MAX_BYTES:65536}

# H2-B2: no discovery or connection is attempted until an enabled provider is used.
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
# Redis is an optional OIDC dependency; its failure must not remove local authentication.
management.health.redis.enabled=false
siare.oidc.app-origin=${APP_ORIGIN:http://127.0.0.1:3100}
siare.oidc.google.enabled=${GOOGLE_OIDC_ENABLED:false}
siare.oidc.google.client-id=${GOOGLE_CLIENT_ID:}
siare.oidc.google.client-secret=${GOOGLE_CLIENT_SECRET:}
siare.oidc.google.issuer=${GOOGLE_ISSUER:https://accounts.google.com}
siare.oidc.google.redirect-uri=${GOOGLE_REDIRECT_URI:}
siare.oidc.gitlab.enabled=${GITLAB_OIDC_ENABLED:false}
siare.oidc.gitlab.client-id=${GITLAB_CLIENT_ID:}
siare.oidc.gitlab.client-secret=${GITLAB_CLIENT_SECRET:}
siare.oidc.gitlab.issuer=${GITLAB_ISSUER:}
siare.oidc.gitlab.redirect-uri=${GITLAB_REDIRECT_URI:}
# Never enable request/response tracing for OAuth exchanges.
logging.level.org.springframework.security.oauth2=WARN
logging.level.org.springframework.web.client=WARN
